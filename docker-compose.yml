# ponytail: no proxy, no network of its own (one volume, for old builds' static files) — it joins the Traefik
# that n8n already runs on. Nothing in the existing stack is touched.
services:
  omh:
    build: .
    env_file: .env
    restart: always
    networks: [web]
    # Keeps old builds' CSS and JS so pages saved before a deploy still load (see Dockerfile).
    volumes: [omh-static:/app/.next/static]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.omh.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.omh.entrypoints=web,websecure
      - traefik.http.routers.omh.tls=true
      - traefik.http.routers.omh.tls.certresolver=mytlschallenge
      - traefik.http.services.omh.loadbalancer.server.port=3000
      # www -> apex, so the two hostnames aren't indexed as duplicates.
      - traefik.http.routers.omh.middlewares=omh-www@docker
      - traefik.http.middlewares.omh-www.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.omh-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.omh-www.redirectregex.permanent=true

volumes:
  omh-static:

networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK}
